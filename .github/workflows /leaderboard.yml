
name: Update Roblox Tab Leaderboard

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: roblox-tab-leaderboard
  cancel-in-progress: true


jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update leaderboard
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python leaderboard.py

      - name: Save message ID
        run: |
          git add message_id.txt
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Save leaderboard message ID"
            git pull --rebase origin HEAD
            git push
          fi

      - name: Clean up old workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          WORKFLOW_ID: ${{ github.workflow }}
        run: |
          gh run list \
            --repo "$REPO" \
            --workflow "$WORKFLOW_ID" \
            --limit 100 \
            --json databaseId \
            --jq '.[3:] | .[].databaseId' |
          while read -r run_id; do
            [ -z "$run_id" ] && continue
            gh run delete "$run_id" --repo "$REPO" || true
          done
